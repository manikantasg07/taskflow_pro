services:
  redis:
    image: redis:7-alpine       
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT}:3000"
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
      - ./shared:/app/shared
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis
    restart: unless-stopped